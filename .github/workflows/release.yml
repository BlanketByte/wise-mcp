name: Release

# Push a tag like v1.2.0 (matching package.json) to publish to npm and the official MCP Registry,
# and attach the Claude Desktop extension (.mcpb) to a GitHub release.
# Every step is safe to repeat: run it manually with an existing tag to finish a release that stopped halfway.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to release again (e.g. v1.0.0)
        required: true

permissions:
  contents: write
  id-token: write # npm trusted publishing (no token) + provenance + MCP Registry login

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # Trusted publishing (OIDC, no NPM_TOKEN) needs npm 11.5.1+, staged publishing 11.15+; Node 22 ships npm 10.
      - run: npm install -g npm@11
      - run: npm ci
      - name: Check tag matches package.json
        run: test "v$(node -p 'require("./package.json").version')" = "$TAG"
      - run: npm test
      - name: Publish to npm (skipped if this version is already there)
        run: |
          VERSION=${TAG#v}
          if curl -sf -o /dev/null "https://registry.npmjs.org/@blanketbyte%2fwise-mcp/$VERSION"; then
            echo "@blanketbyte/wise-mcp@$VERSION is already on npm"
          elif npm publish --provenance --access public 2>&1 | tee publish.log; then
            echo "Published directly"
          else
            # If the trusted publisher is stage-only, stage the version: it goes live once a
            # maintainer approves it on npmjs.com with 2FA. A 409 means it's already staged.
            if npm stage publish --provenance --access public 2>&1 | tee stage.log || grep -q "409" stage.log; then
              echo "::notice::@blanketbyte/wise-mcp@$VERSION is staged. Approve it on npmjs.com (or run: npm stage list / npm stage approve <id>); the next step waits for it."
            else
              cat publish.log; exit 1
            fi
          fi
      - name: Publish to the official MCP Registry
        run: |
          VERSION=${TAG#v}
          jq --arg v "$VERSION" '.version = $v | .packages[0].version = $v' server.json > server.tmp && mv server.tmp server.json
          # A new npm version can take a few minutes to become visible (or wait for staged approval),
          # and the registry checks it exists. Waits up to 30 minutes; re-run the workflow if it times out.
          for i in $(seq 1 90); do
            curl -sf -o /dev/null "https://registry.npmjs.org/@blanketbyte%2fwise-mcp/$VERSION" && break
            echo "Waiting for npm to serve $VERSION (approve it on npmjs.com if it's staged)…"; sleep 20
          done
          curl -sf -o /dev/null "https://registry.npmjs.org/@blanketbyte%2fwise-mcp/$VERSION" || { echo "::error::$VERSION isn't on npm yet. Approve the staged version, then re-run: gh workflow run release.yml -f tag=$TAG"; exit 1; }
          curl -sL "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_linux_amd64.tar.gz" | tar xz mcp-publisher
          ./mcp-publisher login github-oidc
          ./mcp-publisher publish
      - run: npm run mcpb
      - name: GitHub release with the .mcpb
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" release/*.mcpb --clobber
          else
            gh release create "$TAG" release/*.mcpb --title "$TAG" --generate-notes --verify-tag
          fi
        env:
          GH_TOKEN: ${{ github.token }}
